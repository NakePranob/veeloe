[package]
name = "veeloe-protocol"
description = "The Veeloe wire protocol in Rust: envelope, signing and verification."
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
percent-encoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
url = "2"

# `OsRng` asks `getrandom` for bytes; in the browser that is
# `crypto.getRandomValues`, which needs this feature (the Controller's wasm
# build, task 5.2b).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
