schema: spec-driven

context: |
  Repo: veeloe (public, AGPL-3.0), the whole of Veeloe.
  Protocol (packages/protocol: TypeScript, Zod schemas, @noble Ed25519 and
  sealed boxes, JSON signed as exact bytes, additive-only changes).
  Runtime (packages/runtime: TypeScript compiled with Bun, a supervisor plus
  one sandboxed worker process per Agent, bun:sqlite event log per Agent).
  Hub (hub/: Go on go-scaffold 0.14+, hexagonal modules, Postgres).
  Controller (controller/: React Native Expo, Feature-Sliced Design,
  local-first expo-sqlite). e2e seam tests in e2e/.
  Glossary: CONTEXT.md — use its terms. Decisions: docs/adr/.
  Everything here is public: never put a secret or a real key in a spec.
  Conventions: AGENTS.md (English commit subjects and PR titles, Thai bodies
  and PR descriptions).

rules:
  proposal:
    - "Say which parts the change touches (Protocol, Runtime, Hub, Controller)."
    - "Name, by number, the ADRs in docs/adr/ the change relies on."
    - "Name the GitHub issue the change implements (#<number>), and name the change <number>-<slug> after it. A change with no issue says so."
  design:
    - "Do not contradict an ADR in docs/adr/. If the design has to, say so plainly and propose changing the ADR instead of working around it."
    - "Do not contradict the Protocol's compatibility rule: changes are additive only, and receivers skip unknown fields and message types."
  tasks:
    - "End every task with a check at an agreed seam: the e2e test through the Controller protocol (e2e/), a unit test of the worker core (with a fake Clock where time matters), a Protocol test, or a unit test of the code the task touches."

operations:
  apply:
    guidance:
      - "Work on a branch off develop named <type>/<change-name>."
      - "Open the PR with 'Closes #<number>' as the first line of the description, so the squash merge closes the issue."
      - "Commit per AGENTS.md: English subject; the Thai body starts with 'ทำตาม change <name>:'."
  archive:
    guidance:
      - "Archive in the same PR as the change's last task, so develop never holds a finished change that is not archived."

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
