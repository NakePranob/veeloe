<!doctype html>
<!--
  PROTOTYPE, throwaway. Answers one question: "what does Veeloe v0.1 look like end to end?"
  One HTML file, no build, nothing is sent anywhere, state lives in memory.
  The left panel walks through each v0.1 issue; the phone is free to click.
  The Team editor has three layouts (?variant=A|B|C), switched from the bar at the bottom.
  Copies the Controller's tokens (src/shared/ui/theme.ts) and Character (src/entities/agent/ui/Character.tsx) by hand.
-->

<title>Veeloe v0.1 Prototype</title>
<style>

}

    --label: #f5f7fa; --label2: #a3acb9; --label3: #6b7480; --accent: #f5f7fa; --onAccent: #0e1116;
    --orange: #ff9f0a; --green: #30d158; --red: #ff453a; --ground: #000000bf; --scrim: rgba(0, 0, 0, .5);
    --sh: 0 1px 2px 0 rgba(0, 0, 0, .30), 0 8px 24px 0 rgba(0, 0, 0, .35);
    --raised: 0 2px 6px 0 rgba(0, 0, 0, .35), 0 12px 32px 0 rgba(0, 0, 0, .45);
    --phone: 0 30px 80px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #07090c; --bg: #0e1116; --surface: #181c23; --chip: #232833; --chipPressed: #2c323e; --fill: #222731;
  --label: #f5f7fa; --label2: #a3acb9; --label3: #6b7480; --accent: #f5f7fa; --onAccent: #0e1116;

}

/* Walkthrough panel */

/* Phone */

.nav { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 52px; padding: 10px 12px 0; }

.tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 8px 16px; background: var(--bg); }
.tabs button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--label3); padding: 4px 0; }
.tabs button.on { color: var(--label); }

/* Our components */
.card { background: var(--surface); border-radius: 22px; box-shadow: var(--sh); padding: 16px; margin-bottom: 12px; }
.btn { border: 0; border-radius: 999px; min-height: 36px; padding: 0 16px; background: var(--chip); color: var(--label); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .15s cubic-bezier(.22, 1, .36, 1); }
.btn:active { transform: scale(.97); background: var(--chipPressed); }
.btn.primary { background: var(--accent); color: var(--onAccent); }

.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.sec { color: var(--label2); font-size: 13px; font-weight: 600; margin: 16px 8px 6px; }
.hint { display: flex; gap: 6px; align-items: center; color: var(--label2); font-size: 13px; margin: 0 8px 8px; }
.sub { color: var(--label2); font-size: 14px; }
.sub2 { color: var(--label3); font-size: 13px; }
.tag { display: inline-block; background: var(--accent); color: var(--onAccent); font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
.tag.q { background: var(--fill); color: var(--label2); }
.pill-sm { display: inline-flex; align-items: center; gap: 3px; background: var(--fill); color: var(--label2); border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 600; }

.c-orange { color: var(--orange); } .c-green { color: var(--green); } .c-red { color: var(--red); } .c-3 { color: var(--label3); } .c-2 { color: var(--label2); }

/* Inbox rows, laid out like Mail */
.row { display: flex; gap: 12px; width: 100%; text-align: left; border: 0; background: none; padding: 12px 8px; border-radius: 18px; color: inherit; }

.row-top .sub { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { color: var(--label2); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status.em { color: var(--label); font-weight: 600; }
.preview { color: var(--label2); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cluster { position: relative; width: 52px; height: 44px; flex: none; }

/* Character */
.head { display: inline-block; flex: none; position: relative; line-height: 0; }
.head svg { display: block; overflow: visible; }
.m-offline { opacity: .5; }
@keyframes float { from { transform: translateY(0); } to { transform: translateY(-4px); } }

@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

.m-idle .fl, .m-done .fl { animation: float 1.8s ease-in-out infinite alternate; }

.m-waiting .fl { animation: float 1.2s ease-in-out infinite alternate; }
.m-working .nod { animation: nod .25s ease-in-out infinite alternate; transform-origin: 50px 55px; }
.m-idle .bl, .m-thinking .bl, .m-working .bl, .m-waiting .bl { animation: blink 4s infinite; }
.pulse { animation: pulse .6s ease-in-out infinite alternate; }
.scan { animation: scan .9s ease-in-out infinite alternate; }
.hand { animation: wave .8s ease-in-out infinite alternate; }

/* Task, laid out like Messages (pages/task/ui/TaskPage.tsx) */
.nav-title { line-height: 1.2; font-size: 17px; }
.nav-back { font-size: 17px; font-weight: 400; }

.plain { border: 0; background: none; padding: 0; color: inherit; }

.me { justify-self: end; display: grid; justify-items: end; gap: 4px; max-width: 80%; }

.atext { white-space: pre-wrap; font-size: 17px; line-height: 1.4; }
.atext code, .bubble code { font: 14px ui-monospace, Menlo, monospace; background: var(--fill); border-radius: 4px; padding: 0 3px; }
.toolrow, .toolsum { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; }
.toolsum { grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; border: 0; background: none; padding: 0; text-align: left; color: var(--label2); width: 100%; }

.lbl { display: flex; gap: 4px; align-items: center; color: var(--label2); font-size: 13px; }

.ap { display: grid; gap: 8px; margin: 0; }

.composer-wrap { flex: none; padding: 8px 16px; background: var(--bg); }

.composer { display: grid; gap: 4px; background: var(--surface); box-shadow: var(--raised); border-radius: 22px; padding: 8px; }

.readonly { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--surface); box-shadow: var(--raised); border-radius: 22px; padding: 10px 10px 10px 16px; font-size: 13px; color: var(--label2); }
/* The platform's alert, as Alert.alert draws it on iOS. */
.ascrim { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 7; animation: fade .2s ease-out; }
.alert { width: 270px; background: var(--surface); border-radius: 14px; overflow: hidden; text-align: center; box-shadow: var(--raised); }

.alert .ab { display: grid; grid-template-columns: 1fr 1fr; box-shadow: inset 0 .5px 0 var(--label3); }

/* Team tree */
.tree { padding: 8px; }
.tree h4 { margin: 4px 8px 4px; font-size: 13px; color: var(--label2); font-weight: 600; }
.trow { display: flex; gap: 8px; align-items: center; width: 100%; border: 0; background: none; border-radius: 14px; padding: 4px 8px; text-align: left; color: inherit; }

/* Team editor */
.canvas { width: 100%; height: auto; display: block; touch-action: none; user-select: none; }

.pick .main { flex: 1; min-width: 0; }

.stepper b { font-size: 22px; font-weight: 500; min-width: 24px; text-align: center; }
.kind { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--label2); margin: 4px 0; }
.qr { display: block; width: 168px; height: 168px; margin: 8px auto; background: #fff; border-radius: 16px; padding: 10px; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 88px; background: var(--accent); color: var(--onAccent); border-radius: 18px; padding: 12px 14px; font-size: 14px; z-index: 6; box-shadow: var(--raised); animation: up .25s cubic-bezier(.22, 1, .36, 1); }
.toast .sm { opacity: .75; font-size: 13px; margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: 13px; }

// ---------- the Workspace, in memory
const LOOK_COLORS = ["#F4B183", "#9DC3E6", "#A9D18E", "#C9B3E6", "#F6D57A", "#8FD3C8", "#F2A7B8"];

}
let S = fresh();
const variants = { A: "ผังอิสระ", B: "ต้นไม้จาก Entry", C: "ตารางเส้น" };

const A = (id) => S.agents.find((a) => a.id === id);

const busy = (agent, except) => S.tasks.some((t) => t.agent === agent && t.id !== except && RUNNING.includes(t.state));
const LABEL = { thinking: "กำลังคิด", working: "กำลังทำ", waiting: "รออนุมัติ", delegating: "รอทีม", queued: "ต่อคิว", done: "เสร็จ", stopped: "หยุดแล้ว", idle: "ว่าง" };
function moodOfTask(t) {

}

// ---------- Tasks and Delegation (ADR 0003, 0011, 0026)
let tid = 0;
function newTask(agent, title, parent, team) {

const tool = (t, cmd, out, ok = true) => { t.state = "working"; push(t, { t: "tool", cmd, out, ok }); };

// The send tool: a new sub-Task, or the next message in an existing one. Both count against the line.
function send(from, to, text, again) {
  const line = lineOf(from, to);
  if (!line) { push(from, { t: "refused", text: `ไม่มีเส้น ${A(from.agent).name} → ${A(to).name} ใน Flow ของทีมนี้ Runtime ปฏิเสธ` }); return null; }
  const used = from.sends[to] || 0;
  if (used >= line.limit) {
    push(from, { t: "refused", text: `ส่งข้ามเส้น ${A(from.agent).name} → ${A(to).name} ครบ ${line.limit} ครั้งใน Turn นี้แล้ว tool ส่งงานปฏิเสธ` });
    return null;
  }

function qr(seed) {
  let x = seed, cells = "";
  for (let r = 0; r < 21; r++) for (let c = 0; c < 21; c++) {
    x = (x * 9301 + 49297) % 233280;
    const finder = (r < 7 && c < 7) || (r < 7 && c > 13) || (r > 13 && c < 7);
    const on = finder ? (r % 6 === 0 || c % 6 === 0 || (r % 14 > 1 && r % 14 < 5 && c % 14 > 1 && c % 14 < 5) || (c > 13 && (c - 14) % 6 === 0)) : x / 233280 > 0.55;
    if (on) cells += `<rect x="${c}" y="${r}" width="1" height="1"/>`;
  }
  return `<svg class="qr" viewBox="0 0 21 21" fill="#0f1520" aria-label="QR">${cells}</svg>`;
}

function stateText() {
  const lines = [`หน้าจอ: ${S.ws ? cur().screen : "onboard"}${cur().screen === "team" ? ` · แบบ ${variant}` : ""}`];
  S.teams.forEach((tm) => lines.push(`ทีม ${tm.name} (${M(tm.machine).name}) Entry=${A(tm.entry).name}`, ...tm.lines.map((l) => `  ${A(l.from).name} → ${A(l.to).name} · เพดาน ${l.limit}`)));
  const roots = S.tasks.filter((t) => !t.parent);
  if (roots.length) lines.push("", "Task:");
  roots.forEach((r) => {
    const walk = (t, d) => {
      const sends = Object.entries(t.sends).map(([to, n]) => `${A(to).name} ${n}/${lineOf(t, to)?.limit ?? "?"}`).join(", ");
      lines.push(`${"  ".repeat(d + 1)}${t.id} ${A(t.agent).name} [${LABEL[t.state]}]${sends ? ` ส่ง: ${sends}` : ""}`);
      kids(t).forEach((k) => walk(k, d + 1));
    };
    walk(r, 0);
  });
  const q = Object.entries(S.queue).filter(([, v]) => v.length);
  if (q.length) lines.push("", "คิว:", ...q.map(([a, v]) => `  ${A(a).name} ← ${v.join(", ")}`));
  return lines.join("\n");
}

  ${focused ? `<div class="gcard sim"><h3>เกิดอะไรขึ้น ${focused.done ? "· จบแล้ว" : focused.halted ? "· ถูก Stop" : focused.blocked ? "· รอคุณ" : ""}</h3>
    <div class="btns"><button class="btn sm" data-g="tick" ${focused.done || focused.halted ? "disabled" : ""}>ขั้นต่อไป</button><button class="btn sm" data-g="auto">${focused.auto ? "หยุดเล่นอัตโนมัติ" : "เล่นอัตโนมัติ"}</button></div>
    <ul class="narr">${focused.notes.slice(0, 6).map((n) => `<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}
  <div class="gcard"><h3>สถานะทั้งหมด</h3><pre class="state">${esc(stateText())}</pre></div>`;
}
$("#guide").addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-g]");
  if (!el || el.disabled) return;
  const g = el.dataset.g, tab = GUIDE.find((x) => x.id === S.gtab);
  const focused = cur().screen === "task" ? runOf(cur().p.id) : S.focus && runOf(S.focus);
  if (g === "gtab") { S.gtab = el.dataset.id; S.gstep = 0; if (GUIDE.find((x) => x.id === S.gtab).steps[0]) GUIDE.find((x) => x.id === S.gtab).steps[0].go(); }
  if (g === "step") { S.gstep = Number(el.dataset.i); tab.steps[S.gstep].go(); }
  if (g === "next") {
    if (S.gstep + 1 < tab.steps.length) { S.gstep++; tab.steps[S.gstep].go(); }
    else { const i = GUIDE.indexOf(tab), nxt = GUIDE[i + 1] || GUIDE[0]; S.gtab = nxt.id; S.gstep = 0; nxt.steps[0]?.go(); }
  }
  if (g === "scenario") S.scenario = el.dataset.v;
  if (g === "tick" && focused) stepRun(focused);
  if (g === "auto" && focused) focused.auto = !focused.auto;
  render();
});
document.querySelector(".proto").addEventListener("click", (ev) => {
  const g = ev.target.closest("[data-g]")?.dataset.g;
  if (g === "theme") {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
  }
  if (g === "reset") { S = fresh(); }
  render();
});
render();
</script>
