name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # ADR 0022: every part has its structure checked, each by its own tool.
  structure:
    name: Types and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Steiger (Controller, Feature-Sliced Design)
        run: bun run check:controller
      - name: dependency-cruiser (Runtime, supervisor and worker)
        run: bun run check:runtime
      - name: go-scaffold check (Hub)
        run: bun run check:hub
      - name: The Runtime is one binary that runs as supervisor and as worker
        run: |
          bun run --cwd packages/runtime build
          packages/runtime/dist/veeloe
          packages/runtime/dist/veeloe worker --agent ci

  hub:
    name: Hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - uses: golangci/golangci-lint-action@v9
        with:
          # keep in step with GOLANGCI_LINT_VERSION in hub/Makefile
          version: v2.12.2
          working-directory: hub
      - run: go test -race ./...

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - run: bun install --frozen-lockfile
      - name: Postgres and the real Hub, then the seam tests
        run: bun run --cwd e2e test
