name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # ADR 0022: every part has its structure checked, each by its own tool.
  structure:
    name: Types and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Unit tests (Controller prototype)
        run: bun run test
      - name: Steiger (Controller prototype, Feature-Sliced Design)
        run: bun run check:prototype
