name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # ADR 0022: every part has its structure checked, each by its own tool.
  structure:
    name: Types and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Unit tests (Protocol, Controller, Controller prototype)
        run: bun run test
      - name: Steiger (Controller prototype, Feature-Sliced Design)
        run: bun run check:prototype
      - name: Steiger and i18n keys (Controller)
        run: bun run check:controller
      - name: go-scaffold check (Hub)
        run: bun run check:hub

  hub:
    name: Hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hub_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    # Without these the repository tests skip, and a broken one stays green.
    env:
      TEST_DB_DSN: postgres://postgres:postgres@localhost:5432/hub_test?sslmode=disable
      REQUIRE_TEST_DB: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - uses: golangci/golangci-lint-action@v9
        with:
          # keep in step with GOLANGCI_LINT_VERSION in hub/Makefile
          version: v2.12.2
          working-directory: hub
      - name: Apply migrations
        run: |
          # keep in step with MIGRATE_VERSION in hub/Makefile
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
          "$(go env GOPATH)/bin/migrate" -path migrations -database "$TEST_DB_DSN" up
      - run: go test -race ./...

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
