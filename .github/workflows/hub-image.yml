name: Hub image

# The Hub ships as an image on GHCR, never as a GitHub Release: the latest
# release belongs to the Runtime and its updater (ADR 0009, 0025). A version
# tag builds the same `v*` the Runtime release uses, so one tag names both.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    name: Build and push ghcr.io/<owner>/veeloe-hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/veeloe-hub
          # v0.1.0 -> 0.1.0 and 0.1; `latest` only for a release, not a pre-release such as v0.1.0-rc.1.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: hub
          # `api` is the one binary the Hub runs (hub/Dockerfile).
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
